# Deployment Staging
# Builds the staging image on every push to master and rolls it out with Helm
# in the `staging` namespace.
name: Deployment Staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker-build-and-push:
    name: Build [staging]
    uses: ./.github/workflows/build.yaml
    with:
      docker-file: creative-viewer.Dockerfile
      docker-image-name: creative-viewer-staging
      tag: latest
      environment: staging
    secrets: inherit

  deployment:
    name: Deploy [staging]
    runs-on: gha-rtg-adikteev-runners
    needs: [docker-build-and-push]
    steps:
      - uses: actions/checkout@v6

      - name: Execute Helm Deployment Staging
        run: |
          helm upgrade --install --debug \
            --namespace staging \
            --values ./infrastructure/creative-viewer/chart-values/staging.yaml \
            creative-viewer \
            ./infrastructure/creative-viewer \
            --set-string tag=latest

